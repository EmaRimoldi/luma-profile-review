[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-profile-review"
version = "0.1.0"
description = "Evidence-based event networking, with Markdown criteria and interchangeable model backends"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
luma-review = "luma_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
